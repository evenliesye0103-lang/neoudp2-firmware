<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title data-i18n="title">NEO-UDP2 Firmware Folder</title>
  <style>
    body{font-family:Arial,sans-serif;max-width:900px;margin:40px auto;padding:0 16px;background:#0b1220;color:#d9e1f2}
    a{color:#7cc4ff;text-decoration:none}
    a:hover{text-decoration:underline}
    code{background:#121c31;padding:2px 6px;border-radius:6px}
    .card{background:#121c31;padding:20px;border-radius:14px}
    ul{list-style:none;padding:0;margin:0}
    li{padding:8px 0;border-bottom:1px solid #223052;display:flex;justify-content:space-between;gap:12px}
    li:last-child{border-bottom:none}
    .muted{color:#93a3c2;font-size:0.85rem}
    .back{display:inline-block;margin-bottom:16px}
    .langbar{display:flex;justify-content:flex-end;gap:6px;margin-bottom:12px}
    .langbar button{background:#121c31;color:#93a3c2;border:1px solid #223052;padding:6px 12px;border-radius:6px;cursor:pointer;font-size:0.85rem}
    .langbar button.active{background:#7cc4ff;color:#06111f;border-color:#7cc4ff;font-weight:bold}
  </style>
</head>
<body>
  <div class="langbar">
    <button data-lang="ja">日本語</button>
    <button data-lang="en">English</button>
    <button data-lang="id">Indonesia</button>
  </div>

  <a class="back" href="../" data-i18n="back">&larr; Firmware Bank に戻る</a>
  <div class="card">
    <h1 data-i18n="heading">Firmware フォルダ</h1>
    <p class="muted" data-i18n="desc">このリポジトリの /docs/firmware フォルダの中身を自動取得して表示しています。</p>
    <ul id="list"><li class="muted" data-i18n="loading">ファイル一覧を読み込み中...</li></ul>
  </div>

  <script>
    const translations = {
      ja: { title:'NEO-UDP2 Firmware Folder', back:'← Firmware Bank に戻る', heading:'Firmware フォルダ', desc:'このリポジトリの /docs/firmware フォルダの中身を自動取得して表示しています。', loading:'ファイル一覧を読み込み中...', empty:'ファームウェアファイルがまだありません。', error:(m)=>`一覧の取得に失敗しました (${m})。URLを直接開いてください、例: ./NAMA_FILE.bin` },
      en: { title:'NEO-UDP2 Firmware Folder', back:'← Back to Firmware Bank', heading:'Firmware Folder', desc:'Listing is fetched automatically from the /docs/firmware folder in this repo.', loading:'Loading file list...', empty:'No firmware files yet.', error:(m)=>`Failed to load list (${m}). Open the file directly via URL, e.g. ./FILE_NAME.bin` },
      id: { title:'NEO-UDP2 Firmware Folder', back:'← Kembali ke Firmware Bank', heading:'Firmware Folder', desc:'Daftar diambil otomatis dari isi folder /docs/firmware di repo ini.', loading:'Memuat daftar file...', empty:'Belum ada file firmware.', error:(m)=>`Gagal memuat daftar (${m}). Buka langsung file lewat URL, mis: ./NAMA_FILE.bin` },
    };
    const STORAGE_KEY = 'neoudp2-lang';
    const DEFAULT_LANG = 'ja';
    let currentLang = DEFAULT_LANG;

    function applyLang(lang) {
      currentLang = translations[lang] ? lang : DEFAULT_LANG;
      const t = translations[currentLang];
      document.title = t.title;
      document.querySelectorAll('[data-i18n]').forEach((el) => {
        const key = el.getAttribute('data-i18n');
        if (typeof t[key] === 'string') el.textContent = t[key];
      });
      document.querySelectorAll('.langbar button').forEach((btn) => {
        btn.classList.toggle('active', btn.dataset.lang === currentLang);
      });
      try { localStorage.setItem(STORAGE_KEY, currentLang); } catch (e) {}
      renderList();
    }

    document.querySelectorAll('.langbar button').forEach((btn) => {
      btn.addEventListener('click', () => applyLang(btn.dataset.lang));
    });

    let cachedFiles = null;
    let fetchError = null;

    function renderList() {
      const t = translations[currentLang];
      const listEl = document.getElementById('list');
      if (fetchError) {
        listEl.innerHTML = `<li class="muted">${t.error(fetchError)}</li>`;
        return;
      }
      if (!cachedFiles) {
        listEl.innerHTML = `<li class="muted">${t.loading}</li>`;
        return;
      }
      if (cachedFiles.length === 0) {
        listEl.innerHTML = `<li class="muted">${t.empty}</li>`;
        return;
      }
      listEl.innerHTML = cachedFiles.map(f => `
        <li>
          <a href="./${encodeURIComponent(f.name)}">${f.name}</a>
          <span class="muted">${(f.size / 1024).toFixed(1)} KB</span>
        </li>
      `).join('');
    }

    const owner = 'evenliesye0103-lang';
    const repo = 'neoudp2-firmware';

    fetch(`https://api.github.com/repos/${owner}/${repo}/contents/docs/firmware`)
      .then(r => {
        if (!r.ok) throw new Error(`GitHub API HTTP ${r.status}`);
        return r.json();
      })
      .then(files => {
        cachedFiles = files
          .filter(f => f.type === 'file' && f.name.endsWith('.bin'))
          .sort((a, b) => b.name.localeCompare(a.name, undefined, { numeric: true }));
        renderList();
      })
      .catch(err => {
        fetchError = err.message;
        renderList();
      });

    let initialLang = DEFAULT_LANG;
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved && translations[saved]) initialLang = saved;
    } catch (e) {}
    applyLang(initialLang);
  </script>
</body>
</html>
